name: Deploy Quiz Rounds no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validar configuração
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Defina a variável SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Defina SUPABASE_PUBLISHABLE_KEY em Secrets ou Variables" && exit 1)
          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            sb_secret_*) echo "::error::Chave proibida: você colocou uma Secret Key (sb_secret_) no frontend. Copie a Publishable Key (sb_publishable_) em Supabase > Settings > API Keys."; exit 1 ;;
            *) echo "::error::SUPABASE_PUBLISHABLE_KEY inválida. Para este projeto use a chave que começa com sb_publishable_."; exit 1 ;;
          esac
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL inválida. Use a Project URL HTTPS do Supabase."; exit 1 ;;
          esac
      - name: Montar site estático
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site
          cp index.html admin.html display.html simulator.html _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          cat > _site/assets/js/config.js <<EOF
          export const SUPABASE_URL='${SUPABASE_URL}';
          export const SUPABASE_PUBLISHABLE_KEY='${SUPABASE_PUBLISHABLE_KEY}';
          EOF
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
